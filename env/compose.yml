name: mini-agent-mcp
x-app: &app
  image: ${APP_IMAGE:-mini-agent-mcp:local}
  build:
    context: ..
    dockerfile: Dockerfile
  restart: unless-stopped
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
x-data-env: &data-env
  POSTGRES_HOST: ${POSTGRES_HOST:?Set POSTGRES_HOST}
  POSTGRES_PORT: ${POSTGRES_PORT:-5433}
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-prefer}
  REDIS_HOST: ${REDIS_HOST:?Set REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_TLS: ${REDIS_TLS:-false}
  DATABASE_URL: ${DATABASE_URL:-}
  REDIS_URL: ${REDIS_URL:-}
services:
  travel-mcp-server:
    <<: *app
    environment:
      <<: *data-env
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8010"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  backend:
    <<: *app
    command: [python, -m, uvicorn, backend.app.main:app, --host, 0.0.0.0, --port, "8000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *data-env
      LOG_DATABASE_URL: ${LOG_DATABASE_URL:-}
      LOG_REDIS_URL: ${LOG_REDIS_URL:-}
      TRAVEL_MCP_URL: http://travel-mcp-server:8010/mcp
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      WEATHER_AGENT_PROVIDER: ${WEATHER_AGENT_PROVIDER:-gemini}
      PLACE_AGENT_PROVIDER: ${PLACE_AGENT_PROVIDER:-ollama}
      BUDGET_AGENT_PROVIDER: ${BUDGET_AGENT_PROVIDER:-openai}
      VALIDATION_AGENT_PROVIDER: ${VALIDATION_AGENT_PROVIDER:-openai}
    depends_on:
      travel-mcp-server:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  frontend:
    <<: *app
    command: [python, -m, streamlit, run, frontend/app.py, --server.address=0.0.0.0, --server.port=8501, --server.headless=true, --browser.gatherUsageStats=false]
    environment:
      BACKEND_API_URL: http://backend:8000
    ports:
      - "${FRONTEND_BIND_IP:-0.0.0.0}:${FRONTEND_PORT:-80}:8501"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
