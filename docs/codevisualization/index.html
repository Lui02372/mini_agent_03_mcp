<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code Visualization · 프로젝트 지도</title>
<style>body{margin:0;background:#101c28;color:#e7eff5;font:15px system-ui}header{padding:30px;background:#172b3d}h1{margin:8px 0;font-size:32px}p{line-height:1.8}small{color:#b6c5d1}button,select,input{font:inherit;padding:10px;border-radius:8px;border:1px solid #6e8596;background:#233b4d;color:white}button{cursor:pointer}button[aria-pressed=true]{background:#366d60}nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}main{padding:24px;max-width:1400px;margin:auto}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:22px}aside{max-height:75vh;overflow:auto}aside button{display:block;width:100%;text-align:left;margin:5px 0;font-size:12px;overflow-wrap:anywhere}.card{padding:22px;background:#192d3c;border:1px solid #365162;border-radius:16px;margin-bottom:16px}#drawing{overflow:auto}svg{min-width:700px;width:100%;display:block}svg text{font:12px system-ui;fill:#eef5fa}svg .node{cursor:pointer}svg .node:focus{outline:3px solid #ffd478}table{border-collapse:collapse;width:100%;font-size:12px}td,th{text-align:left;border-bottom:1px solid #365162;padding:9px;overflow-wrap:anywhere}code{color:#b3e7d5}a{color:#a8e1ed}.badge{padding:5px 9px;background:#284637;border-radius:8px}#summary{font-size:13px}#details{overflow-wrap:anywhere}#details button{margin:4px;font-size:12px}.filters{display:grid;gap:8px;margin-bottom:14px}pre{white-space:pre-wrap} @media(max-width:750px){.layout{display:block}aside{max-height:220px}main{padding:12px}header{padding:20px}h1{font-size:26px}}</style>
<header><small>CODE → CONNECTIONS → ARCHITECTURE</small><h1>프로젝트를 한눈에 읽는 지도</h1><p>파일 연결과 시스템 설계를 분리해 봅니다. 선은 실행 성공을 보증하지 않습니다.</p><div id="summary"></div><nav><button data-mode="architecture">전체 아키텍처</button><button data-mode="files">파일 연결</button><button data-mode="signals">반복·이벤트·외부 경계</button><button data-mode="cycles">순환·미해결 연결</button></nav></header>
<main><div class="layout"><aside><div class="filters"><label>파일 검색<input id="query" placeholder="Community, rag, .mjs…" style="width:100%;box-sizing:border-box"></label><label>폴더<select id="folder"><option value="">전체</option></select></label><label><input type="checkbox" id="tests" checked> 테스트 파일 포함</label></div><div id="files"></div></aside><section><div class="card" id="intro"></div><div class="card" id="drawing"></div><div class="card" id="details" aria-live="polite"></div></section></div></main>
<script>const data={"generatedAt":"2026-09-21T09:02:02.590Z","scope":"First-party source inventory; excludes dependencies/builds/secrets/data directories. JS/TS literal relative import/require/file-URL edges only; heuristic, not complete semantic analysis. Java/Python inventoried but not resolved. No runtime connectivity claim.","files":["DEPLOYMENT.md","README.md","backend/__init__.py","backend/app/__init__.py","backend/app/agent.py","backend/app/main.py","backend/app/mcp_client.py","backend/app/schemas.py","detail.md","docker-compose.yml","drawing.md","env/compose.yml","example.md","explain.md","frontend/app.py","mcp_server/policy_stdio_server.py","mcp_server/travel_server.py","mcpdonotknow.md","ops/check_services.py","solution/README.md","starter/README.md"],"edges":[],"unresolved":[],"signals":[{"file":"frontend/app.py","kind":"network","line":14}],"cycles":[],"architecture":{"nodes":[{"id":"frontend","label":"Streamlit frontend","status":"implemented","description":"Code configuration; external data reachability must be checked separately.","evidence":["frontend/app.py","env/compose.yml"]},{"id":"backend","label":"FastAPI backend","status":"implemented","description":"Code configuration; external data reachability must be checked separately.","evidence":["backend/app/main.py","backend/app/mcp_client.py"]},{"id":"travel","label":"Travel HTTP MCP","status":"implemented","description":"Code configuration; external data reachability must be checked separately.","evidence":["mcp_server/travel_server.py"]},{"id":"policy","label":"Policy stdio MCP","status":"implemented","description":"Code configuration; external data reachability must be checked separately.","evidence":["mcp_server/policy_stdio_server.py"]},{"id":"ci","label":"GitHub Actions / EC2 runner","status":"implemented","description":"Workflow and shell script manually reviewed; extractor excludes hidden .github and shell scripts.","evidence":["env/compose.yml"],"manualEvidence":[".github/workflows/deploy.yml","ops/deploy.sh"]},{"id":"data","label":"External PostgreSQL / Redis check","status":"implemented","description":"Code configuration; external data reachability must be checked separately.","evidence":["ops/check_services.py","env/compose.yml"]}],"edges":[{"from":"frontend","to":"backend","label":"HTTP","status":"implemented"},{"from":"backend","to":"travel","label":"Streamable HTTP","status":"implemented"},{"from":"backend","to":"policy","label":"stdio subprocess","status":"implemented"},{"from":"ci","to":"frontend","label":"tested image deployment","status":"implemented"},{"from":"ci","to":"backend","label":"tested image deployment","status":"implemented"},{"from":"ci","to":"travel","label":"tested image deployment","status":"implemented"},{"from":"ci","to":"data","label":"read-only preflight; optional for demo","status":"implemented"}]}};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let mode='architecture',selected=data.files.includes('web/src/main.jsx')?'web/src/main.jsx':data.files[0];
$('#summary').textContent=`${data.files.length} 파일 · ${data.edges.length} 정적 연결 · ${data.cycles.length} 순환 묶음 · 생성 ${data.generatedAt}`;
for(const f of [...new Set(data.files.map(f=>f.split('/')[0]))]){const o=document.createElement('option');o.value=f;o.textContent=f;$('#folder').append(o);}
function fileButtons(){const files=data.files.filter(f=>f.toLowerCase().includes($('#query').value.toLowerCase())&&(!$('#folder').value||f.split('/')[0]===$('#folder').value)&&($('#tests').checked||!/(?:test|smoke)/.test(f)));$('#files').replaceChildren();for(const f of files){const b=document.createElement('button');b.textContent=f;b.onclick=()=>{selected=f;mode='files';render();};$('#files').append(b);}}
function links(files){return files.map(f=>`<button data-file="${esc(f)}">${esc(f)}</button>`).join('')||'없음';}
function diagram(nodes,edges){const cols=3,w=1100,h=Math.max(160,Math.ceil(nodes.length/cols)*130);const pos=new Map(nodes.map((n,i)=>[n.id,{x:20+(i%cols)*360,y:30+Math.floor(i/cols)*130}]));let svg=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="연결 다이어그램"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#93b4c7"/></marker></defs>`;for(const e of edges){const a=pos.get(e.from),b=pos.get(e.to);if(!a||!b)continue;svg+=`<path d="M${a.x+150},${a.y+70} Q${a.x+150},${b.y-12} ${b.x+150},${b.y}" fill="none" stroke="#789aae" opacity=".6" ${e.status==='planned'?'stroke-dasharray="6 5"':''} marker-end="url(#arrow)"/>`;}
for(const n of nodes){const p=pos.get(n.id);svg+=`<g class="node" tabindex="0" role="button" aria-label="${esc(n.label)}" data-node="${esc(n.id)}"><rect x="${p.x}" y="${p.y}" width="310" height="72" rx="12" fill="${n.status==='planned'?'#4d394b':n.status==='conditional'?'#4b462f':'#234b48'}" stroke="#72918f"/><text x="${p.x+12}" y="${p.y+27}">${esc(n.label.length>40?n.label.slice(0,37)+'…':n.label)}</text><text x="${p.x+12}" y="${p.y+51}">${esc(n.status||'정적 파일 연결')}</text><title>${esc(n.label)}</title></g>`;}return svg+'</svg>';}
function table(rows){return '<table><thead><tr><th>출발</th><th>도착 / 종류</th><th>근거 / 조건</th></tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';}
function render(){document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));let nodes=[],edges=[];
if(mode==='architecture'){nodes=data.architecture.nodes;edges=data.architecture.edges;$('#intro').innerHTML='<h2>시스템 아키텍처</h2><p>implemented = 코드 근거 있음 · conditional = 설정/공급자 필요 · planned = 계획/미구현. 배포·실행 상태를 검사한 결과가 아닙니다. 노드를 눌러 근거 파일을 확인하세요.</p>';$('#details').innerHTML=table(edges.map(e=>[e.from,e.to,e.label]));}
if(mode==='files'){const incoming=data.edges.filter(e=>e.to===selected),outgoing=data.edges.filter(e=>e.from===selected),neighbors=[...new Set([selected,...incoming.map(e=>e.from),...outgoing.map(e=>e.to)])];nodes=neighbors.map(id=>({id,label:id}));edges=[...incoming,...outgoing];$('#intro').innerHTML='<h2>'+esc(selected)+'</h2><p>화살표: 가져오는 파일 → 참조되는 파일. 문자열 기반 정적 후보이며 함수 호출 순서가 아닙니다. 모든 파일은 왼쪽에서 검색 가능합니다.</p>';$('#details').innerHTML='<h3>이 파일을 사용하는 곳</h3>'+links(incoming.map(e=>e.from))+'<h3>이 파일이 사용하는 것</h3>'+links(outgoing.map(e=>e.to))+table(edges.map(e=>[e.from,e.to,e.kind+' · '+e.from+':'+e.line]));}
if(mode==='signals'){$('#intro').innerHTML='<h2>반복·이벤트·경계 후보</h2><p>timer는 예약 작업이 아니라 타임아웃일 수도 있습니다. useEffect는 무조건 주기적으로 실행되지 않습니다. 각 줄의 실제 코드를 확인해야 합니다.</p>';const rows=data.signals.filter(e=>e.file.toLowerCase().includes($('#query').value.toLowerCase())&&(!$('#folder').value||e.file.split('/')[0]===$('#folder').value)&&($('#tests').checked||!/(?:test|smoke)/.test(e.file)));$('#details').innerHTML=table(rows.map(e=>[e.file,e.kind,'line '+e.line]));}
if(mode==='cycles'){$('#intro').innerHTML='<h2>분석 범위와 빈틈</h2><p>'+esc(data.scope)+'</p>';$('#details').innerHTML='<h3>정적 import 순환</h3><pre>'+esc(JSON.stringify(data.cycles,null,2))+'</pre><h3>미해결 상대 경로</h3>'+table(data.unresolved.map(e=>[e.from,e.spec,e.kind+' · line '+e.line]))+'<p>계산된 동적 경로, 별칭, Java DI, SQL 관계, 실제 네트워크 호출 관계는 이 추출기가 완전히 해석하지 않습니다. 아키텍처 지도에서 검토한 근거로 보완합니다. 비밀 파일과 빌드/외부 패키지/데이터 저장 디렉터리는 제외합니다.</p>';}
$('#drawing').innerHTML=nodes.length?diagram(nodes,edges):'<p>이 화면은 아래 표로 확인합니다.</p>';document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>{selected=b.dataset.file;mode='files';render();});document.querySelectorAll('[data-node]').forEach(b=>{const open=()=>{const n=nodes.find(n=>n.id===b.dataset.node);if(mode==='files'){selected=n.id;render();}else{$('#details').innerHTML='<h2>'+esc(n.label)+'</h2><p>'+esc(n.description||'')+'</p><h3>근거 파일</h3>'+links(n.evidence||[]);document.querySelectorAll('[data-file]').forEach(x=>x.onclick=()=>{selected=x.dataset.file;mode='files';render();});}};b.onclick=open;b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}};});}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render();});for(const s of ['#query','#folder','#tests'])$(s).addEventListener('input',()=>{fileButtons();if(mode==='signals')render();});fileButtons();render();</script></html>
